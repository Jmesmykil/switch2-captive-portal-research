<!doctype html><html><body style="margin:0;padding:12px;font-family:system-ui;background:#07090d;color:#cfe3ff">
<h1 style="font-size:17px">WebKit — background hold</h1>
<button id="sus" style="font-size:20px;padding:12px 24px;border-radius:10px">SUSPEND VIEW</button>
<button id="res" style="font-size:16px;padding:10px 18px;border-radius:10px">RESUME</button>
<div id="vis" style="margin-top:10px;font:12px ui-monospace;color:#9fb4d6"></div>
<pre id="o" style="font:12px/1.4 ui-monospace;white-space:pre-wrap;color:#9fb4d6"></pre>
<script>
var L=[],o=document.getElementById("o"),v=document.getElementById("vis");
function lg(s){o.textContent+=s+"\n";L.push(s);try{fetch("/report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ua:navigator.userAgent,lines:L})}).catch(function(){})}catch(e){}}
function hb(s){try{fetch("/beacon",{method:"POST",body:JSON.stringify({kind:"heartbeat",vis:document.visibilityState,ts:Date.now(),note:s})}).catch(function(){})}catch(e){}}
document.addEventListener("visibilitychange",function(){lg("visibility="+document.visibilityState);v.textContent="state: "+document.visibilityState;hb("vischange:"+document.visibilityState)});
// worker keeps its own thread alive while the view is hidden
var code="var n=0;setInterval(function(){n++;postMessage({n:n,vis:'worker'})},3000);";
var w=null;
function startWorker(){
  try{
    w=new Worker(URL.createObjectURL(new Blob([code],{type:"text/javascript"})));
    w.onmessage=function(e){v.textContent="worker alive n="+e.data.n;hb("worker:"+e.data.n);};
    lg("worker started (survives view suspension)");
  }catch(e){lg("worker failed: "+e.message)}
}
document.getElementById("sus").addEventListener("click",function(){
  lg("SUSPEND VIEW — page hidden, worker keeps the channel");
  document.body.style.visibility="hidden";
  document.body.style.display="none";
  try{document.title="suspended";}catch(e){}
  hb("suspend-click");
  startWorker();
});
document.getElementById("res").addEventListener("click",function(){
  document.body.style.visibility="visible";
  document.body.style.display="block";
  lg("RESUMED");
  hb("resume-click");
});
lg("ready — press SUSPEND VIEW, then switch to the next exploit");
hb("ready");
</script></body></html>
